<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<title>WF 02 – App Padres Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ── BASE DESIGN SYSTEM ─────────────────────────────── */
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

:root {
  --navy:   #1E1B4B;
  --indigo: #3730A3;
  --violet: #6D28D9;
  --purple-lt: #EDE9FE;
  --green-lt:  #DCFCE7;
  --green:     #16A34A;
  --red-lt:    #FEE2E2;
  --red:       #DC2626;
  --amber-lt:  #FEF3C7;
  --amber:     #D97706;
  --blue-lt:   #DBEAFE;
  --blue:      #2563EB;
  --gray-50:   #F9FAFB;
  --gray-100:  #F3F4F6;
  --gray-200:  #E5E7EB;
  --gray-300:  #D1D5DB;
  --gray-400:  #9CA3AF;
  --gray-500:  #6B7280;
  --gray-700:  #374151;
  --gray-900:  #111827;
  --white:     #FFFFFF;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.08);
  --shadow-md: 0 4px 12px rgba(0,0,0,.10);
  --radius:    8px;
  --radius-lg: 12px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body { font-family: 'DM Sans', sans-serif; background: var(--gray-50); color: var(--gray-900); min-height: 100vh; }
a { color: inherit; text-decoration: none; }
button { cursor: pointer; font-family: inherit; }

/* ── UTILITY ─── */
.flex   { display: flex; }
.flex-col { display: flex; flex-direction: column; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.gap-1 { gap: 4px; } .gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .gap-4 { gap: 16px; }
.p-2   { padding: 8px; }  .p-3 { padding: 12px; } .p-4 { padding: 16px; }
.px-3  { padding: 0 12px; } .py-2 { padding: 8px 0; }
.mt-1  { margin-top: 4px; } .mt-2 { margin-top: 8px; } .mt-3 { margin-top: 12px; }
.mb-1  { margin-bottom: 4px; } .mb-2 { margin-bottom: 8px; } .mb-3 { margin-bottom: 12px; }
.text-xs  { font-size: 11px; } .text-sm { font-size: 12px; } .text-base { font-size: 14px; }
.text-lg  { font-size: 16px; } .text-xl { font-size: 20px; } .text-2xl { font-size: 24px; }
.font-medium { font-weight: 500; } .font-semibold { font-weight: 600; }
.text-muted { color: var(--gray-400); } .text-secondary { color: var(--gray-500); }
.w-full { width: 100%; }
.rounded { border-radius: var(--radius); } .rounded-lg { border-radius: var(--radius-lg); }
.border  { border: 1px solid var(--gray-200); }
.bg-white { background: var(--white); }
.bg-gray  { background: var(--gray-50); }
.shadow   { box-shadow: var(--shadow-sm); }

/* ── COMPONENTS ─── */
.card {
  background: var(--white);
  border: 1px solid var(--gray-200);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
}
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 7px 16px; border-radius: var(--radius); font-size: 12px;
  font-weight: 500; border: 1px solid var(--gray-300);
  background: var(--white); color: var(--gray-700);
  transition: background .15s;
}
.btn:hover { background: var(--gray-100); }
.btn-primary {
  background: var(--navy); color: var(--white); border-color: var(--navy);
}
.btn-primary:hover { background: var(--indigo); border-color: var(--indigo); }
.btn-sm { padding: 5px 12px; font-size: 11px; }
.input {
  width: 100%; padding: 7px 10px; border: 1px solid var(--gray-300);
  border-radius: var(--radius); font-size: 12px; font-family: inherit;
  color: var(--gray-900); background: var(--white);
}
.input::placeholder { color: var(--gray-400); }
.input:focus { outline: none; border-color: var(--indigo); box-shadow: 0 0 0 3px rgba(99,102,241,.15); }
.label { font-size: 11px; font-weight: 500; color: var(--gray-600); margin-bottom: 4px; display: block; }
.badge {
  display: inline-flex; align-items: center;
  padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 500;
}
.badge-green  { background: var(--green-lt);  color: var(--green); }
.badge-red    { background: var(--red-lt);    color: var(--red); }
.badge-amber  { background: var(--amber-lt);  color: var(--amber); }
.badge-blue   { background: var(--blue-lt);   color: var(--blue); }
.badge-purple { background: var(--purple-lt); color: var(--indigo); }

/* ── TOPBAR ─── */
.topbar {
  background: var(--navy); color: var(--white);
  padding: 10px 20px; display: flex; align-items: center; justify-content: space-between;
}
.topbar .logo { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.topbar .tag  { font-size: 10px; padding: 1px 8px; border: 1px solid rgba(255,255,255,.25); border-radius: 20px; color: rgba(255,255,255,.65); }

/* ── SIDEBAR ─── */
.sidebar {
  width: 200px; flex-shrink: 0;
  background: var(--white); border-right: 1px solid var(--gray-200);
  display: flex; flex-direction: column;
}
.sidebar .nav-section { font-size: 10px; font-weight: 600; color: var(--gray-400); padding: 14px 16px 6px; letter-spacing: .6px; text-transform: uppercase; }
.nav-item {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 16px; font-size: 12px; color: var(--gray-600);
  border-left: 3px solid transparent; cursor: pointer;
  transition: background .1s;
}
.nav-item:hover { background: var(--gray-50); }
.nav-item.active { color: var(--indigo); background: var(--purple-lt); border-left-color: var(--indigo); font-weight: 500; }
.nav-item .icon { width: 16px; text-align: center; }

/* ── TABLE ─── */
.table { width: 100%; border-collapse: collapse; }
.table th { font-size: 11px; font-weight: 500; color: var(--gray-500); background: var(--gray-50); padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--gray-200); }
.table td { font-size: 12px; color: var(--gray-800); padding: 9px 12px; border-bottom: 1px solid var(--gray-100); vertical-align: middle; }
.table tr:last-child td { border-bottom: none; }
.table tr:hover td { background: var(--gray-50); }

/* ── MOBILE SHELL ─── */
.phone-shell {
  width: 320px; border: 2px solid var(--gray-300); border-radius: 28px;
  overflow: hidden; background: var(--white);
  box-shadow: 0 8px 32px rgba(0,0,0,.12);
}
.phone-notch {
  height: 24px; background: var(--gray-900);
  display: flex; align-items: center; justify-content: center;
}
.phone-notch::after {
  content: ''; width: 80px; height: 8px;
  background: var(--gray-800); border-radius: 4px;
}
.mobile-topbar {
  padding: 10px 14px; background: var(--white);
  border-bottom: 1px solid var(--gray-100);
  display: flex; align-items: center; justify-content: space-between;
}
.mobile-nav {
  display: flex; justify-content: space-around;
  padding: 8px 0; border-top: 1px solid var(--gray-100); background: var(--white);
}
.mobile-nav-item {
  display: flex; flex-direction: column; align-items: center;
  gap: 3px; font-size: 9px; color: var(--gray-400); cursor: pointer;
}
.mobile-nav-item.active { color: var(--indigo); }
.mobile-nav-icon {
  width: 22px; height: 22px; border-radius: 6px;
  background: var(--gray-100); display: flex; align-items: center; justify-content: center; font-size: 11px;
}
.mobile-nav-item.active .mobile-nav-icon { background: var(--purple-lt); }

/* ── FORM ─── */
.form-group { display: flex; flex-direction: column; gap: 4px; }
.select-mock {
  padding: 7px 10px; border: 1px solid var(--gray-300); border-radius: var(--radius);
  font-size: 12px; color: var(--gray-700); background: var(--white);
  display: flex; align-items: center; justify-content: space-between; cursor: pointer;
}
.select-mock::after { content: '▾'; color: var(--gray-400); font-size: 10px; }

/* ── WIZARD STEP ─── */
.step-bar { display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--gray-200); }
.step { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.step-circle {
  width: 30px; height: 30px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600; flex-shrink: 0;
}
.step-circle.done  { background: var(--navy); color: var(--white); }
.step-circle.active { background: var(--indigo); color: var(--white); box-shadow: 0 0 0 4px var(--purple-lt); }
.step-circle.todo  { background: var(--gray-100); color: var(--gray-400); border: 1px solid var(--gray-300); }
.step-label { font-size: 10px; color: var(--gray-500); white-space: nowrap; }
.step-label.active { color: var(--indigo); font-weight: 500; }
.step-connector { flex: 1; height: 1px; background: var(--gray-200); margin: 0 8px; margin-bottom: 16px; }
.step-connector.done { background: var(--indigo); }
body{display:flex;align-items:flex-start;justify-content:center;padding:32px;background:var(--gray-50);}
</style></head><body>
<div>
<p style="font-size:11px;color:var(--gray-400);margin-bottom:16px;font-family:monospace">WIREFRAME 02 / 15 — APP PADRES · LOGIN</p>
<div class="phone-shell">
  <div class="phone-notch"></div>
  <div style="padding:32px 24px;display:flex;flex-direction:column;align-items:center;gap:20px;min-height:560px">
    <div style="width:72px;height:72px;border-radius:50%;background:var(--purple-lt);display:flex;align-items:center;justify-content:center;font-size:34px;margin-top:12px">🏫</div>
    <div style="text-align:center">
      <p style="font-weight:600;font-size:16px;color:var(--gray-900)">Colegio XYZ</p>
      <p style="font-size:11px;color:var(--gray-400);margin-top:2px">Portal para apoderados</p>
    </div>
    <div style="width:100%;display:flex;flex-direction:column;gap:10px">
      <div class="form-group">
        <label class="label">Email o usuario</label>
        <input class="input" placeholder="usuario@email.com">
      </div>
      <div class="form-group">
        <label class="label">Contraseña</label>
        <input class="input" type="password" placeholder="••••••••">
      </div>
      <button class="btn btn-primary w-full" style="margin-top:4px">Ingresar</button>
    </div>
    <a style="font-size:12px;color:var(--indigo);cursor:pointer">Olvidé mi contraseña</a>
    <div style="border-top:1px solid var(--gray-100);width:100%;padding-top:16px;text-align:center">
      <p style="font-size:12px;color:var(--gray-500)">¿Primera vez? <span style="color:var(--indigo);cursor:pointer">Solicitar cuenta</span></p>
    </div>
  </div>
</div>
</div>
</body></html>
